name: Deploy

on:
  push:
    branches: [main]
  # Bài blog hẹn ngày đăng (ngayDang) chỉ tự hiện khi build LẠI sau đúng giờ đó — chạy lại
  # đều đặn để bài hẹn lịch tự "sống dậy" đúng giờ, không cần ai bấm tay.
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      # Chup lai sitemap DANG live TRUOC khi deploy, de lat nua biet bai nao vua moi len.
      - name: Ghi nhớ sitemap đang live (để biết bài nào mới)
        run: node .github/bao-index.mjs ghi-nho

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e9e88ac586803b53ffff66350dd0e375
          command: pages deploy dist --project-name=tim-hang-xe-tai-web

      # Bao cho Bing/Yandex/Naver/Seznam biet BAI VUA LEN CONG KHAI (IndexNow).
      # Chi bao URL moi hoac doi ngay — khong bao lai ca sitemap. Google KHONG dung
      # IndexNow: Google di theo sitemap + Search Console.
      - name: Báo index bài vừa lên công khai
        run: node .github/bao-index.mjs bao
