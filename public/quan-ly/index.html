<style>
  :root { --blue:#0a4091; --blue-d:#073365; --yellow:#e7f705; --ink:#14142b; --muted:#5b6b82; --line:#dfe4ee; --bg:#f2f5fb; --good:#16a34a; --ok:#eab308; --bad:#e11d48; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Nunito',system-ui,Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  button { font:inherit; cursor:pointer; }
  input, textarea, select { font:inherit; }
  .hidden { display:none !important; }

  /* Top bar */
  .top { background:var(--blue); color:#fff; padding:12px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; position:sticky; top:0; z-index:10; }

  .top nav { display:flex; gap:6px; margin-left:auto; flex-wrap:wrap; }

  @keyframes moiGlow { 0%,100%{ box-shadow:0 0 0 2px #f59e0b,0 8px 20px rgba(245,158,11,.25);} 50%{ box-shadow:0 0 0 3px #d97706,0 12px 30px rgba(245,158,11,.6);} }
  .mbadge-moi { position:absolute; top:6px; left:6px; background:#f59e0b; color:#3a2600; font-weight:900; font-size:11px; padding:3px 9px; border-radius:999px; z-index:3; box-shadow:0 2px 6px rgba(0,0,0,.25); }
  .mname { font-weight:800; font-size:12.5px; margin-top:7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .msize { color:var(--muted); font-size:11px; margin-top:2px; }
  .mbtns { display:flex; gap:6px; margin-top:8px; }
  .btn.sm { padding:6px 7px; font-size:11px; font-weight:800; flex:1; white-space:nowrap; border-radius:8px; }
  .btn.sm i { font-size:10.5px; margin-right:2px; }

  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:13px 22px; border-radius:12px; font-weight:800; z-index:100; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  .spin { display:inline-block; width:16px;height:16px;border:3px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px; }
  @keyframes sp { to{transform:rotate(360deg);} }
  .center-msg { text-align:center; color:var(--muted); padding:40px; }

  /* Xem truoc bai viet */
  .pv-body { font-size:16.5px; line-height:1.8; color:#26263a; }
  .pv-body h2 { font-size:22px; font-weight:800; margin:24px 0 10px; color:var(--ink); }
  .pv-body h3 { font-size:18px; font-weight:800; margin:20px 0 8px; color:var(--ink); }
  .pv-body p { margin:0 0 14px; }
  .pv-body ul, .pv-body ol { margin:0 0 14px; padding-left:22px; }
  .pv-body li { margin-bottom:6px; }
  .pv-body a { color:var(--blue); font-weight:700; text-decoration:underline; }

<div id="app"></div>

<script>
/* ==================================================================
   ⚙️  KHỐI CẤU HÌNH — CHỈ SỬA CHỖ NÀY KHI ÁP CHO 1 WEB MỚI
   (mọi phần khác của file GIỮ NGUYÊN — đây là bộ khung dùng chung)
   ================================================================== */
const CFG = {
  repo:    'maivannhan2025-bot/tim-hang-xe-tai-web',  // kho GitHub của web này
  branch:  'main',                                    // nhánh chính (thường 'main')
  auth:    'https://sveltia-auth.vantaidanhlong.workers.dev', // dùng CHUNG cầu đăng nhập Danh Long (đúng cách Lê Chung đã làm)
  site:    'https://timhangxetai.com',                // tên miền web thật
  brand:   'TÌM HÀNG XE TẢI',                         // tên hiện ở đầu trang quản lý + màn đăng nhập
  brandMark: 'TX',                                    // 2 chữ tắt trong ô tròn màn đăng nhập
  blogDir: 'src/content/blog',                        // thư mục bài blog (.md) — giữ nguyên nếu dùng khung Astro chuẩn
  imgDir:  'public/anh',                              // thư mục ảnh — giữ nguyên nếu dùng khung Astro chuẩn
};
/* Ví dụ web Danh Long (mẫu thật đang chạy):
     repo: 'vantaidanhlong-cyber/vantaidanhlong-web'
     auth: 'https://sveltia-auth.vantaidanhlong.workers.dev'
     site: 'https://vantaidanhlong.com'
   ================================================================== */
const TOKEN_KEY = 'qltoken_' + CFG.repo;   // khoá lưu đăng nhập (tự tách theo web, không cần đổi)
const API = 'https://api.github.com/repos/' + CFG.repo + '/contents/';
let TOKEN = sessionStorage.getItem(TOKEN_KEY) || '';
const app = document.getElementById('app');

/* ---------- tiện ích ---------- */
const b64enc = (str) => btoa(unescape(encodeURIComponent(str)));
const b64dec = (b64) => decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));
const esc = (s) => (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function toast(msg, ms) { const t=document.createElement('div'); t.className='toast'; t.innerHTML=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms||2500); }
// Dựng mã nhúng video (giống index.astro) để xem trước NGAY trong trình sửa
function veVideoEmbed(u){
  u=String(u||'').trim(); if(!u) return '';
  const m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|v\/))([\w-]{11})/);
  if(m) return '<iframe src="https://www.youtube.com/embed/'+m[1]+'?rel=0&playsinline=1" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="width:100%;height:100%;border:0"></iframe>';
  if(/\.(mp4|webm|ogg)(\?|$)/i.test(u)) return '<video src="'+u+'" playsinline controls style="width:100%;height:100%"></video>';
  return '<iframe src="'+u+'" frameborder="0" allow="autoplay" allowfullscreen style="width:100%;height:100%;border:0"></iframe>';
}

async function gh(path, opts) {
  opts = opts || {};
  const r = await fetch(API + path, {
    ...opts,
    headers: { Authorization: 'Bearer ' + TOKEN, Accept: 'application/vnd.github+json', ...(opts.headers||{}) },
  });
  if (r.status === 401) { logout(); throw new Error('Hết phiên đăng nhập, vui lòng đăng nhập lại.'); }
  return r;
}

/* ---------- LƯU QUA GITHUB CÓ TỰ THỬ LẠI KHI LỆCH PHIÊN BẢN (409 "does not match") ----------
   build(latest) nhận phiên bản MỚI NHẤT của file trên GitHub: { sha, content(base64), json } — hoặc
   null nếu file chưa tồn tại. build trả về body cho PUT { message, content, [sha], [branch] }.
   Không đặt sha thì ghPut tự gắn sha mới nhất. Khi GitHub báo lệch ("does not match"/409), ghPut
   lấy lại bản mới rồi dựng body lại và thử tiếp (tối đa 5 lần, chờ tăng dần) → cú lưu tự "lành",
   không mất thay đổi của mình lẫn của cửa sửa khác. Trả JSON của PUT khi thành công. */
async function ghPut(path, build) {
  let lastErr = 'Lỗi lưu ' + path;
  for (let attempt = 0; attempt < 5; attempt++) {
    let latest = null;
    try {
      const g = await gh(path + '?ref=' + CFG.branch);
      if (g.ok) {
        const c = await g.json();
        let json = null; try { json = JSON.parse(b64dec(c.content)); } catch (_) {}
        latest = { sha: c.sha, content: c.content, json: json };
      }
    } catch (_) {}
    const body = build(latest) || {};
    if (body.branch === undefined) body.branch = CFG.branch;
    if (body.sha === undefined && latest && latest.sha) body.sha = latest.sha;
    const r = await gh(path, { method: 'PUT', body: JSON.stringify(body) });
    if (r.ok) return await r.json();
    let j = {}; try { j = await r.json(); } catch (_) {}
    lastErr = j.message || lastErr;
    const conflict = r.status === 409 || /does not match|but expected/i.test(j.message || '');
    if (conflict && attempt < 4) { await new Promise(res => setTimeout(res, 400 + attempt * 500)); continue; }
    throw new Error(lastErr);
  }
  throw new Error(lastErr);
}

/* ---------- đăng nhập GitHub qua cầu ---------- */
function login() {
  const w = 700, h = 800;
  const popup = window.open(
    CFG.auth + '/auth?provider=github&scope=repo,user&site_id=' + CFG.site.replace(/^https?:\/\//,'').replace(/\/+$/,''),
    'github-login', `width=${w},height=${h},left=${(screen.width-w)/2},top=${(screen.height-h)/2}`
  );
  function handler(e) {
    if (typeof e.data !== 'string') return;
    if (e.data.indexOf('authorization:github:success:') === 0) {
      try { const p = JSON.parse(e.data.substring('authorization:github:success:'.length)); TOKEN = p.token; sessionStorage.setItem(TOKEN_KEY, TOKEN); } catch (err) {}
      window.removeEventListener('message', handler);
      try { popup.close(); } catch(_){}
      route('home');
    } else if (e.data.indexOf('authorizing:github') === 0) {
      popup.postMessage('authorizing:github', e.origin);
    } else if (e.data.indexOf('authorization:github:error:') === 0) {
      window.removeEventListener('message', handler);
      toast('❌ Đăng nhập lỗi. Thử lại nhé.');
    }
  }
  window.addEventListener('message', handler, false);
}
function logout() { TOKEN=''; sessionStorage.removeItem(TOKEN_KEY); route('login'); }

/* ---------- frontmatter (đơn giản) ---------- */
function parseMd(text) {
  const m = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
  const fm = {}; let body = text;
  if (m) {
    body = m[2];
    m[1].split('\n').forEach((line) => {
      const mm = line.match(/^([a-zA-Z0-9_]+):\s*(.*)$/);
      if (mm) { let v = mm[2].trim(); if ((v.startsWith('"')&&v.endsWith('"'))||(v.startsWith("'")&&v.endsWith("'"))) v=v.slice(1,-1); fm[mm[1]] = v; }
    });
  }
  return { fm, body };
}
function buildMd(fm, body) {
  let out = '---\n';
  out += 'title: ' + JSON.stringify(fm.title||'') + '\n';
  out += 'description: ' + JSON.stringify(fm.description||'') + '\n';
  out += 'ngayDang: ' + (fm.ngayDang||'') + '\n';
  if (fm.thoiGianDoc) out += 'thoiGianDoc: ' + fm.thoiGianDoc + '\n';
  if (fm.anhDaiDien) out += 'anhDaiDien: ' + JSON.stringify(fm.anhDaiDien) + '\n';
  if (fm.tuKhoa) out += 'tuKhoa: ' + JSON.stringify(fm.tuKhoa) + '\n';
  out += '---\n\n' + (body||'');
  return out;
}
function slugify(s) {
  return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d')
    .replace(/[^a-z0-9\s-]/g,'').trim().replace(/\s+/g,'-').replace(/-+/g,'-').slice(0,80);
}

/* ---------- markdown -> HTML (xem trước, tối giản) ---------- */
function mdToHtml(md) {
  let h = esc(md);
  h = h.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2">');
  h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  h = h.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>').replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  const lines = h.split('\n'); let out=''; let inUl=false;
  for (let ln of lines) {
    if (/^\s*-\s+/.test(ln)) { if(!inUl){out+='<ul>';inUl=true;} out+='<li>'+ln.replace(/^\s*-\s+/,'')+'</li>'; continue; }
    if (inUl){out+='</ul>';inUl=false;}
    if (/^<h[23]>/.test(ln)) { out+=ln; continue; }
    if (ln.trim()==='') { continue; }
    out += '<p>'+ln+'</p>';
  }
  if(inUl) out+='</ul>';
  return out;
}

/* ---------- chấm SEO ---------- */
function stripMd(s){return (s||'').replace(/```[\s\S]*?```/g,' ').replace(/!\[[^\]]*\]\([^)]*\)/g,' ').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/[#>*_`~-]/g,' ').replace(/\s+/g,' ').trim();}
function wcount(s){return stripMd(s).split(/\s+/).filter(Boolean).length;}
function seoCheck({kw,title,desc,content}){
  const plain=stripMd(content); const wc=wcount(content); const nk=(kw||'').toLowerCase().trim(); const C=[];
  const add=(s,b)=>C.push({s,b});
  const has=(t)=>nk&&(t||'').toLowerCase().indexOf(nk)!==-1;
  if(!nk){add('bad','Chưa nhập từ khoá chính');}
  else{ has(title)?add('good','Từ khoá có trong tiêu đề'):add('bad','Từ khoá chưa có trong tiêu đề'); }
  const tl=(title||'').length;
  tl===0?add('bad','Chưa có tiêu đề'):(tl>=40&&tl<=65)?add('good','Độ dài tiêu đề tốt ('+tl+')'):add('ok','Tiêu đề '+(tl<40?'hơi ngắn':'hơi dài')+' ('+tl+')');
  const dl=(desc||'').length;
  dl===0?add('bad','Chưa có mô tả SEO'):(dl>=120&&dl<=160)?add('good','Độ dài mô tả tốt ('+dl+')'):add('ok','Mô tả '+(dl<120?'hơi ngắn':'hơi dài')+' ('+dl+')');
  if(nk&&dl){ has(desc)?add('good','Mô tả có từ khoá'):add('ok','Mô tả chưa có từ khoá'); }
  wc===0?add('bad','Chưa có nội dung'):wc>=600?add('good','Bài đủ dài ('+wc+' từ)'):wc>=300?add('ok','Bài hơi ngắn ('+wc+' từ)'):add('bad','Bài quá ngắn ('+wc+' từ)');
  if(nk&&wc){ has(plain.slice(0,250))?add('good','Từ khoá xuất hiện sớm'):add('ok','Từ khoá chưa có ở đầu bài'); }
  const heads=(content.match(/^#{2,3}\s+.+$/gm)||[]).length;
  heads>=2?add('good','Có '+heads+' tiêu đề phụ'):add('ok','Nên chia mục (## Tiêu đề)');
  const links=(content.match(/\[[^\]]+\]\([^)]+\)/g)||[]).filter(l=>!/^!\[/.test(l)).length;
  links>=1?add('good','Có '+links+' liên kết'):add('ok','Nên thêm liên kết nội bộ');
  const imgs=(content.match(/!\[[^\]]*\]\([^)]*\)/g)||[]).length;
  imgs>=1?add('good','Có '+imgs+' ảnh'):add('ok','Nên thêm ảnh minh hoạ');
  return C;
}

/* ---------- chấm SEO cho nội dung HTML (trình soạn WordPress/TinyMCE) ---------- */
function htmlToText(h){ const d=document.createElement('div'); d.innerHTML=h||''; return (d.textContent||d.innerText||'').replace(/\s+/g,' ').trim(); }
function seoCheckHtml({kw,title,desc,html}){
  html=html||''; const plain=htmlToText(html); const wc=plain?plain.split(/\s+/).filter(Boolean).length:0;
  const nk=(kw||'').toLowerCase().trim(); const C=[]; const add=(s,b)=>C.push({s,b}); const has=t=>nk&&(t||'').toLowerCase().indexOf(nk)!==-1;
  if(!nk){ add('bad','Chưa nhập từ khoá chính'); } else { has(title)?add('good','Từ khoá có trong tiêu đề'):add('bad','Từ khoá chưa có trong tiêu đề'); }
  const tl=(title||'').length; tl===0?add('bad','Chưa có tiêu đề'):(tl>=40&&tl<=65)?add('good','Độ dài tiêu đề tốt ('+tl+')'):add('ok','Tiêu đề '+(tl<40?'hơi ngắn':'hơi dài')+' ('+tl+')');
  const dl=(desc||'').length; dl===0?add('bad','Chưa có mô tả SEO'):(dl>=120&&dl<=160)?add('good','Độ dài mô tả tốt ('+dl+')'):add('ok','Mô tả '+(dl<120?'hơi ngắn':'hơi dài')+' ('+dl+')');
  if(nk&&dl){ has(desc)?add('good','Mô tả có từ khoá'):add('ok','Mô tả chưa có từ khoá'); }
  wc===0?add('bad','Chưa có nội dung'):wc>=600?add('good','Bài đủ dài ('+wc+' từ)'):wc>=300?add('ok','Bài hơi ngắn ('+wc+' từ)'):add('bad','Bài quá ngắn ('+wc+' từ)');
  if(nk&&wc){ has(plain.slice(0,250))?add('good','Từ khoá xuất hiện sớm'):add('ok','Từ khoá chưa có ở đầu bài'); }
  const heads=(html.match(/<h[23][\s>]/gi)||[]).length; heads>=2?add('good','Có '+heads+' tiêu đề phụ'):add('ok','Nên chia mục (Tiêu đề 2/3)');
  const links=(html.match(/<a\s[^>]*href/gi)||[]).length; links>=1?add('good','Có '+links+' liên kết'):add('ok','Nên thêm liên kết nội bộ');
  const imgsH=(html.match(/<img[\s>]/gi)||[]).length; imgsH>=1?add('good','Có '+imgsH+' ảnh'):add('ok','Nên thêm ảnh minh hoạ');
  return C;
}

/* ---------- BLOG ---------- */
async function renderBlogList() {
  app.innerHTML = topBar('blog') + `<div class="wrap">
    <div class="toolbar"><button class="btn yellow" onclick="route('blogEdit')">➕ Viết bài mới</button></div>
    <h2 class="page">Các bài viết</h2><p class="sub" id="blCount">Bấm một bài để sửa.</p>
    <div id="bl" class="list"><div class="center-msg"><span class="spin"></span> Đang tải…</div></div>
  </div>`;
  try {
    const r = await gh(CFG.blogDir + '?ref=' + CFG.branch);
    const files = (await r.json()).filter(f => f.name.endsWith('.md'));
    if (!files.length) { document.getElementById('bl').innerHTML = '<div class="center-msg">Chưa có bài nào. Bấm “Viết bài mới”.</div>'; return; }
    const items = await Promise.all(files.map(async f => {
      try { const c = await (await gh('src/content/blog/' + f.name + '?ref=' + CFG.branch)).json(); const { fm } = parseMd(b64dec(c.content)); return { name:f.name, sha:c.sha, fm }; }
      catch { return { name:f.name, sha:f.sha, fm:{} }; }
    }));
    // Moi nhat truoc: sap xep theo ngayDang giam dan (bai chua co ngay roi xuong cuoi)
    items.sort((a, b) => (b.fm.ngayDang || '').localeCompare(a.fm.ngayDang || ''));
    const today = new Date().toISOString().slice(0, 10);
    const soLenLich = items.filter(it => it.fm.ngayDang && it.fm.ngayDang > today).length;
    document.getElementById('blCount').innerHTML = `Bấm một bài để sửa. <b>Tổng ${items.length} bài</b>`
      + (soLenLich ? ` — <span style="color:var(--ok);font-weight:800">${soLenLich} bài đang chờ lên lịch</span>` : '');
    document.getElementById('bl').innerHTML = items.map(it => {
      const img = it.fm.anhDaiDien ? CFG.site + it.fm.anhDaiDien : '';
      const isScheduled = it.fm.ngayDang && it.fm.ngayDang > today;
      const dateLabel = !it.fm.ngayDang ? '' : isScheduled
        ? `<span style="color:var(--ok);font-weight:800">📅 Lên lịch ${esc(it.fm.ngayDang)}</span>`
        : `<span>Ngày đăng ${esc(it.fm.ngayDang)}</span>`;
      return `<div class="list-item">
        ${img ? `<img src="${esc(img)}" onerror="this.style.visibility='hidden'">` : `<img src="" style="visibility:hidden">`}
        <div><div class="t">${esc(it.fm.title || it.name)}</div><div class="d">${dateLabel}${dateLabel ? ' — ' : ''}${esc((it.fm.description||'').slice(0,70))}</div></div>
        <div class="go" style="display:flex;gap:8px;flex-shrink:0">
          <button class="btn ghost" onclick="previewFromList('${encodeURIComponent(it.name)}')">👁️ Xem trước</button>
          <button class="btn ghost" onclick="route('blogEdit','${encodeURIComponent(it.name)}')">Sửa →</button>
        </div>
      </div>`;
    }).join('');
  } catch (e) { document.getElementById('bl').innerHTML = '<div class="center-msg">Lỗi tải: ' + esc(e.message) + '</div>'; }
}

        <div class="field" style="display:flex;gap:14px;flex-wrap:wrap">

  ['f_title','f_desc','f_kw'].forEach(id=>$(id).addEventListener('input',refresh));

    const today=new Date().toISOString().slice(0,10);

    let ngay;

    else { ngay=$('f_date').value||today; }            // Lên lịch = dùng ô "Ngày đăng"
    const nfm={ title, description:$('f_desc').value.trim(), ngayDang:ngay, thoiGianDoc:$('f_read').value.trim(), anhDaiDien:$('f_img').value.trim(), tuKhoa:$('f_kw').value.trim() };

/* ---------- thư viện ảnh (chọn / tải) ---------- */
async function openGallery(onPick) {
  const ov=document.createElement('div'); ov.style='position:fixed;inset:0;background:rgba(20,20,43,.55);z-index:260;display:grid;place-items:center;padding:20px';
  ov.innerHTML=`<div style="background:#fff;border-radius:16px;max-width:820px;width:100%;max-height:85vh;overflow:auto;padding:20px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><b style="font-size:18px">Chọn ảnh</b>
      <label class="btn yellow" style="margin-left:auto">⬆️ Tải ảnh mới<input id="up" type="file" accept="image/*" style="display:none"></label>
      <button class="btn ghost" id="cls">Đóng</button></div>
    <div id="gg" class="gallery"><div class="center-msg"><span class="spin"></span> Đang tải…</div></div></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove(); ov.querySelector('#cls').onclick=close; ov.onclick=e=>{if(e.target===ov)close();};
  async function loadImgs(){
    try{ const [res,dateMap]=await Promise.all([ gh(CFG.imgDir+'?ref='+CFG.branch), anhThuTuMap() ]);
      const files=sortMoiTruoc((await res.json()).filter(f=>/\.(webp|jpg|jpeg|png|gif)$/i.test(f.name)), dateMap);
      ov.querySelector('#gg').innerHTML=files.map(f=>`<div class="g" data-p="/anh/${esc(f.name)}"><img src="${CFG.site}/anh/${esc(f.name)}" loading="lazy"><span>${esc(f.name)}</span></div>`).join('')||'<div class="center-msg">Chưa có ảnh.</div>';
      ov.querySelectorAll('.g').forEach(g=>g.onclick=()=>{ onPick(g.dataset.p); close(); });
    }catch(e){ ov.querySelector('#gg').innerHTML='Lỗi: '+esc(e.message); }
  }
  loadImgs();
  ov.querySelector('#up').onchange=async(ev)=>{
    const file=ev.target.files[0]; if(!file) return;
    const name=slugify(file.name.replace(/\.[^.]+$/,''))+'.'+(file.name.split('.').pop().toLowerCase());
    const b64=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result.split(',')[1]);fr.readAsDataURL(file);});
    toast('<span class="spin"></span> Đang tải ảnh lên…',6000);
    try{ await ghPut(CFG.imgDir+'/'+name,()=>({message:'Tải ảnh: '+name,content:b64})); toast('✅ Đã tải ảnh'); onPick('/anh/'+name); close(); }
    catch(e){ toast('❌ '+esc(e.message)); }
  };
}

  /* ----- Máy tạo & quản lý KHOÁ API ----- */
  async function sha256hex(s){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }

    const bak=data.apiKeys.slice(); data.apiKeys.splice(i,1);
    try{ await saveChung('Thu hồi khoá API: '+k.name); toast('✅ Đã thu hồi khoá'); renderKeyList(); }
    catch(e){ data.apiKeys=bak; toast('❌ '+esc(e.message)); }

  async function newKey(){
    const name=((prompt('Đặt tên cho khoá này (để anh nhớ nó dùng cho ai, VD: n8n, đối tác A):','')||'').trim());

    const rnd=crypto.getRandomValues(new Uint8Array(24));
    const full='dl_'+[...rnd].map(b=>b.toString(16).padStart(2,'0')).join('');
    const hash=await sha256hex(full);
    const entry={ name, created:new Date().toISOString().slice(0,10), prefix:full.slice(0,10), last4:full.slice(-4), hash };

      <div style="text-align:right;margin-top:16px"><button class="btn ghost" id="kdone" type="button">Tôi đã lưu — đóng lại</button></div>
    </div>`;
    document.body.appendChild(ov);

    ov.querySelector('#kcopy').onclick=()=>{ inp.focus(); inp.select(); const t=inp.value; if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>toast('✅ Đã sao chép khoá')).catch(()=>{ try{document.execCommand('copy')}catch(_){}; toast('✅ Đã sao chép'); }); } else { try{document.execCommand('copy')}catch(_){}; toast('✅ Đã sao chép'); } };

/* ---------- SỬA TRANG CHỦ TRỰC QUAN ---------- */
function setPath(obj, path, val) {
  const parts = path.split('.'); let o = obj;
  for (let i=0;i<parts.length-1;i++){ const k=parts[i]; if(o[k]==null) o[k]={}; o=o[k]; }
  o[parts[parts.length-1]] = val;

// Đọc lịch sử tải để biết ảnh nào mới (1 request): commit message "Tải ảnh: <tên>".
async function anhThuTuMap(){
  try{
    const r=await fetch('https://api.github.com/repos/'+CFG.repo+'/commits?sha='+CFG.branch+'&path='+encodeURIComponent(CFG.imgDir)+'&per_page=100',
      { headers:{ Authorization:'Bearer '+TOKEN, Accept:'application/vnd.github+json' } });
    if(!r.ok) return {};
    const cs=await r.json(); const m={};
    for(const c of cs){ const line=(((c.commit||{}).message)||'').split('\n')[0]; const mm=line.match(/^Tải ảnh:\s*(.+?)\s*$/);
      if(mm){ const nm=mm[1]; if(!(nm in m)) m[nm]=(((c.commit||{}).committer||{}).date)||''; } }
    return m;
  }catch(_){ return {}; }
}
function sortMoiTruoc(files, dateMap){
  dateMap=dateMap||{};
  return files.slice().sort((a,b)=>{
    const da=dateMap[a.name], db=dateMap[b.name];
    if(da&&db) return da<db?1:(da>db?-1:0);   // ngày mới hơn đứng trước
    if(da&&!db) return -1; if(!da&&db) return 1;
    return a.name<b.name?-1:1;                 // cả 2 không rõ ngày → theo tên
  });
}
function kbText(sz){ return sz?(sz>=1048576?(sz/1048576).toFixed(1)+' MB':Math.round(sz/1024)+' KB'):''; }
function mcardHTML(name,url,sha,kb,moi,src){
  return `<div class="mcard${moi?' moi':''}" data-name="${esc(name)}" data-sha="${esc(sha||'')}">
    <div class="mthumb">${moi?'<span class="mbadge-moi">🆕 Mới tải</span>':''}<img src="${esc(src||url)}" loading="lazy" onerror="this.style.opacity=.15"></div>
    <div class="mname" title="${esc(name)}">${esc(name)}</div>
    <div class="msize" data-kb="${esc(kb||'')}">${esc(kb||'')}</div>
    <div class="mbtns">
      <button class="btn ghost sm" data-copy="${esc(url)}" title="Chép link ảnh"><i class="fa-solid fa-copy"></i> Chép link</button>
      <button class="btn danger sm" data-del="${esc(name)}" title="Xoá ảnh"><i class="fa-solid fa-trash"></i> Xoá</button>
    </div>
  </div>`;
}
function bindMediaCard(card){
  const cp=card.querySelector('[data-copy]'); if(cp) cp.onclick=()=>copyLink(cp.dataset.copy);
  const dl=card.querySelector('[data-del]'); if(dl) dl.onclick=()=>delMedia(card.dataset.name, card.dataset.sha, card);
  const img=card.querySelector('img'), sz=card.querySelector('.msize');
  if(img&&sz){ const show=()=>{ if(img.naturalWidth){ const kb=sz.dataset.kb||''; sz.textContent=img.naturalWidth+' × '+img.naturalHeight+' px'+(kb?' · '+kb:''); } };
    if(img.complete&&img.naturalWidth) show(); else img.addEventListener('load',show,{once:true}); }
}
// Chèn NGAY 1 thẻ ảnh vừa tải lên ĐẦU lưới (dùng ảnh máy → hiện tức thì, không chờ web).
function insertMediaCard(opts){

async function uploadOneImg(file) {
  const name = slugify(file.name.replace(/\.[^.]+$/,'')) + '.' + (file.name.split('.').pop().toLowerCase());
  const dataUrl = await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(file); });
  const b64 = dataUrl.split(',')[1];
  toast('<span class="spin"></span> Đang tải: '+esc(name), 8000);
  try {
    const resp = await ghPut(CFG.imgDir+'/'+name, ()=>({ message:'Tải ảnh: '+name, content:b64 }));
    toast('✅ Đã tải: '+esc(name));
    // hiện NGAY bằng ảnh máy (không chờ web), nhảy lên ĐẦU, có nhãn "Mới tải"
    insertMediaCard({ name, url:CFG.site+'/anh/'+name, sha:(resp&&resp.content?resp.content.sha:''), kb:kbText(file.size), localSrc:dataUrl });
    return true;
  } catch(e){ toast('❌ '+esc(e.message)); return false; }
}

  try {
    const [res, dateMap] = await Promise.all([ gh(CFG.imgDir+'?ref='+CFG.branch), anhThuTuMap() ]);
    const files = sortMoiTruoc((await res.json()).filter(f=>/\.(webp|jpg|jpeg|png|gif|svg)$/i.test(f.name)), dateMap);
    if(!files.length){ grid.innerHTML='<div class="center-msg">Chưa có ảnh nào. Bấm “Tải ảnh mới lên”.</div>'; return; }
    grid.innerHTML = files.map(f=>mcardHTML(f.name, CFG.site+'/anh/'+f.name, f.sha, kbText(f.size), false)).join('');
    grid.querySelectorAll('.mcard').forEach(bindMediaCard);
  } catch(e){ grid.innerHTML='<div class="center-msg">Lỗi tải: '+esc(e.message)+'</div>'; }
}
function copyLink(t){
  const done=()=>toast('✅ Đã chép link ảnh');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done)); }
  else fallbackCopy(t,done);
}
function fallbackCopy(t,done){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(_){} ta.remove(); done(); }
async function delMedia(name, sha, card){
  if(!confirm('Xoá ảnh “'+name+'”?\n\nNếu ảnh này đang dùng trên web thì chỗ đó sẽ mất ảnh.\n(Vẫn khôi phục lại được nếu cần — gọi Claude.)')) return;
  if(card){ card.style.transition='.15s'; card.style.opacity='.3'; card.style.pointerEvents='none'; }  // mờ đi ngay
  try{
    if(!sha){ const ex=await (await gh(CFG.imgDir+'/'+name+'?ref='+CFG.branch)).json(); sha=ex.sha; }
    const r=await gh(CFG.imgDir+'/'+name,{ method:'DELETE', body:JSON.stringify({ message:'Xoá ảnh: '+name, sha, branch:CFG.branch }) });
    const j=await r.json(); if(!r.ok) throw new Error(j.message||'Lỗi xoá');
    toast('✅ Đã xoá: '+esc(name)); if(card) card.remove(); else loadMedia();   // MẤT NGAY khỏi lưới
  }catch(e){ toast('❌ '+esc(e.message)); if(card){ card.style.opacity=''; card.style.pointerEvents=''; } }
}

/* ---------- khởi động ---------- */
try { document.title = 'Trang quản lý — ' + CFG.brand; } catch(_) {}
route(TOKEN ? 'home' : 'login');
</script>
