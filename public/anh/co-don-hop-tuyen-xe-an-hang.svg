<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Cũng tài xế đó, mặt vui, xe đã ăn hàng, điện thoại báo có đơn hợp tuyến">
  <defs>
    <linearGradient id="troi2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf8f"/><stop offset="1" stop-color="#ffeed3"/>
    </linearGradient>
    <linearGradient id="dat2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcb98d"/><stop offset="1" stop-color="#c29d72"/>
    </linearGradient>
    <clipPath id="khung2"><rect width="600" height="400"/></clipPath>
  </defs>

  <g clip-path="url(#khung2)">
    <rect width="600" height="400" fill="url(#troi2)"/>
    <!-- nắng sớm -->
    <circle cx="112" cy="86" r="46" fill="#ffbe62" opacity=".75"/>
    <circle cx="112" cy="86" r="72" fill="#ffbe62" opacity=".22"/>
    <rect x="0" y="238" width="130" height="52" fill="#c9a27a" opacity=".55"/>
    <rect x="360" y="248" width="240" height="42" fill="#c9a27a" opacity=".45"/>
    <rect y="290" width="600" height="110" fill="url(#dat2)"/>
    <ellipse cx="210" cy="332" rx="150" ry="12" fill="#a8845e" opacity=".45"/>

    <!-- ===== CÙNG CHIẾC XE ĐÓ, nhưng đã ăn hàng ===== -->
    <g>
      <circle cx="120" cy="300" r="25" fill="#33394a"/><circle cx="120" cy="300" r="10" fill="#5a6274"/>
      <circle cx="266" cy="300" r="25" fill="#33394a"/><circle cx="266" cy="300" r="10" fill="#5a6274"/>
      <circle cx="314" cy="300" r="25" fill="#33394a"/><circle cx="314" cy="300" r="10" fill="#5a6274"/>
      <rect x="76" y="270" width="266" height="14" rx="3" fill="#474f63"/>
      <path d="M70 274 V196 q0-12 12-12 h68 v90 z" fill="#67728a"/>
      <rect x="82" y="196" width="62" height="34" rx="4" fill="#ffe2ab"/>
      <rect x="70" y="252" width="14" height="10" rx="2" fill="#474f63"/>
      <!-- hàng chất đầy, bạt căng, chằng dây -->
      <path d="M158 244 V182 q0-8 8-8 h168 q8 0 8 8 v62 Z" fill="#3a4256"/>
      <path d="M158 190 h184" stroke="#4a5670" stroke-width="3"/>
      <path d="M196 176 V244 M250 174 V244 M304 176 V244" stroke="#eb3309" stroke-width="5" stroke-linecap="round" opacity=".92"/>
      <rect x="152" y="244" width="192" height="30" rx="2" fill="#556080"/>
    </g>

    <!-- ===== CÙNG NGƯỜI ĐÓ: ngẩng lên, cười, giơ điện thoại ===== -->
    <g>
      <path d="M330 400 C 336 324 384 292 452 292 C 534 292 590 330 600 400 Z" fill="#7d8ca0"/>
      <path d="M424 294 L458 322 L492 294 C 478 288 438 288 424 294 Z" fill="#6d7c90"/>
      <rect x="436" y="240" width="44" height="56" rx="16" fill="#bb8259"/>
      <g transform="rotate(-5 458 202)">
        <ellipse cx="458" cy="192" rx="48" ry="56" fill="#d4966b"/>
        <ellipse cx="411" cy="198" rx="8" ry="12" fill="#bb8259"/>
        <ellipse cx="505" cy="198" rx="8" ry="12" fill="#bb8259"/>
        <path d="M412 188 q4 -14 12 -20 v22 z" fill="#2f3644"/>
        <path d="M504 188 q-4 -14 -12 -20 v22 z" fill="#2f3644"/>
        <!-- vẫn cái mũ ấy -->
        <path d="M412 178 C 412 140 432 120 458 120 C 484 120 504 140 504 178 Z" fill="#46506a"/>
        <path d="M394 174 Q 458 158 518 172 Q 516 188 458 193 Q 400 189 394 174 Z" fill="#3b445c"/>
        <!-- lông mày nhướn lên = nhẹ nhõm -->
        <path d="M428 208 q11 -7 22 -2" stroke="#2f3644" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M488 208 q-11 -7 -22 -2" stroke="#2f3644" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- mắt cười -->
        <path d="M429 230 q10 -12 20 0" stroke="#2f3644" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <path d="M467 230 q10 -12 20 0" stroke="#2f3644" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <path d="M458 228 v14 q-6 3 -9 0" stroke="#b3794f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <!-- miệng cười, hé răng -->
        <path d="M436 254 q22 26 44 0 z" fill="#8f5a3c"/>
        <path d="M441 254 h34 q-3 6 -8 7 h-18 q-5 -1 -8 -7 z" fill="#fff6ec"/>
      </g>
      <!-- tay giơ điện thoại lên, màn hình sáng, có báo đơn -->
      <path d="M596 400 C 588 344 566 306 534 292" stroke="#6d7c90" stroke-width="30" fill="none" stroke-linecap="round"/>
      <g transform="rotate(11 540 250)">
        <rect x="521" y="220" width="38" height="60" rx="7" fill="#252b38"/>
        <rect x="526" y="226" width="28" height="46" rx="3" fill="#ffd782"/>
        <rect x="530" y="234" width="20" height="4" rx="2" fill="#8a6420"/>
        <rect x="530" y="243" width="14" height="4" rx="2" fill="#8a6420"/>
        <rect x="530" y="252" width="17" height="4" rx="2" fill="#8a6420"/>
      </g>
      <circle cx="566" cy="222" r="11" fill="#eb3309"/>
      <text x="566" y="227" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
      <ellipse cx="534" cy="290" rx="17" ry="14" fill="#d4966b"/>
    </g>
  </g>
</svg>
