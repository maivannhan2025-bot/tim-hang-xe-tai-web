<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Tài xế ngồi cạnh xe tải thùng trống, vẻ mặt lo lắng">
  <defs>
    <linearGradient id="troi1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f8a9f"/><stop offset="1" stop-color="#b9c0cb"/>
    </linearGradient>
    <linearGradient id="dat1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b8f9b"/><stop offset="1" stop-color="#6e7382"/>
    </linearGradient>
    <clipPath id="khung1"><rect width="600" height="400"/></clipPath>
  </defs>

  <g clip-path="url(#khung1)">
    <rect width="600" height="400" fill="url(#troi1)"/>
    <ellipse cx="150" cy="76" rx="120" ry="34" fill="#98a1b3" opacity=".55"/>
    <ellipse cx="430" cy="54" rx="150" ry="30" fill="#98a1b3" opacity=".45"/>
    <rect x="0" y="238" width="130" height="52" fill="#6b7183" opacity=".6"/>
    <rect x="360" y="248" width="240" height="42" fill="#6b7183" opacity=".45"/>
    <rect y="290" width="600" height="110" fill="url(#dat1)"/>
    <ellipse cx="210" cy="332" rx="150" ry="12" fill="#63687a" opacity=".5"/>

    <!-- ===== XE TẢI: thùng trống, bạt xẹp ===== -->
    <g>
      <circle cx="120" cy="300" r="25" fill="#262c3a"/><circle cx="120" cy="300" r="10" fill="#4c5364"/>
      <circle cx="266" cy="300" r="25" fill="#262c3a"/><circle cx="266" cy="300" r="10" fill="#4c5364"/>
      <circle cx="314" cy="300" r="25" fill="#262c3a"/><circle cx="314" cy="300" r="10" fill="#4c5364"/>
      <rect x="76" y="270" width="266" height="14" rx="3" fill="#3c4354"/>
      <path d="M70 274 V196 q0-12 12-12 h68 v90 z" fill="#59637a"/>
      <rect x="82" y="196" width="62" height="34" rx="4" fill="#9aa4b6"/>
      <rect x="70" y="252" width="14" height="10" rx="2" fill="#3c4354"/>
      <rect x="152" y="244" width="192" height="30" rx="2" fill="#4a5468"/>
      <!-- bạt xẹp xuống vì thùng không có hàng -->
      <path d="M158 244 C 200 232 250 238 292 234 C 318 232 334 240 340 244 Z" fill="#2c3342"/>
      <!-- khung mui trơ ra -->
      <path d="M170 244 V232 M212 244 V228 M254 244 V233 M296 244 V230" stroke="#39414f" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- ===== TÀI XẾ: vai chùng, cúi nhìn điện thoại ===== -->
    <g>
      <path d="M330 400 C 340 330 386 300 452 300 C 534 300 590 336 600 400 Z" fill="#6b7a8c"/>
      <path d="M424 302 L458 330 L492 302 C 478 296 438 296 424 302 Z" fill="#5d6b7c"/>
      <rect x="436" y="248" width="44" height="56" rx="16" fill="#b07852"/>
      <g transform="rotate(7 458 210)">
        <ellipse cx="458" cy="200" rx="48" ry="56" fill="#c68a63"/>
        <ellipse cx="411" cy="206" rx="8" ry="12" fill="#b07852"/>
        <ellipse cx="505" cy="206" rx="8" ry="12" fill="#b07852"/>
        <path d="M412 196 q4 -14 12 -20 v22 z" fill="#2f3644"/>
        <path d="M504 196 q-4 -14 -12 -20 v22 z" fill="#2f3644"/>
        <!-- mũ lưỡi trai -->
        <path d="M412 186 C 412 148 432 128 458 128 C 484 128 504 148 504 186 Z" fill="#3d4657"/>
        <path d="M394 182 Q 458 166 518 180 Q 516 196 458 201 Q 400 197 394 182 Z" fill="#333b4a"/>
        <!-- lông mày: đầu trong nhướn lên = lo lắng -->
        <path d="M428 226 Q 439 219 451 215" stroke="#2f3644" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M488 226 Q 477 219 465 215" stroke="#2f3644" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- mắt nhìn xuống, mí sụp -->
        <ellipse cx="439" cy="234" rx="4" ry="4.6" fill="#2f3644"/>
        <ellipse cx="477" cy="234" rx="4" ry="4.6" fill="#2f3644"/>
        <path d="M431 227 q8 -4 16 -1 M485 227 q-8 -4 -16 -1" stroke="#a86f4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M458 236 v14 q-6 3 -9 0" stroke="#a86f4a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <!-- miệng trễ xuống -->
        <path d="M440 254 q18 -13 36 0" stroke="#8f5a3c" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>
      <!-- tay buông, cầm hờ điện thoại, màn hình tối -->
      <path d="M352 400 C 356 350 372 328 400 322" stroke="#5d6b7c" stroke-width="30" fill="none" stroke-linecap="round"/>
      <ellipse cx="401" cy="344" rx="19" ry="16" fill="#c68a63"/>
      <g transform="rotate(-14 402 328)">
        <rect x="384" y="300" width="36" height="56" rx="6" fill="#252b38"/>
        <rect x="389" y="306" width="26" height="42" rx="3" fill="#5b6373"/>
      </g>
      <path d="M392 342 h20 M392 351 h18" stroke="#c68a63" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
</svg>
